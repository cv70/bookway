[workspace]
members = [
  "bookway/bbs",
  "bookway/bbs-link",
  "bookway/bbs-feed",
  "bookway/search-main",
  "bookway/user-event",
  "bookway/bbs-search",
  "bookway/comment",
  "bookway/commonlikestatus",
  "bookway/gateway",
  "bookway/growth",
  "bookway/recommend-main",
  "bookway/media",
  "bookway/content-audit",
  "bookway/feature-main",
  "bookway/recommend-recall",
  "bookway/recommend-rank",
  "cmd/db-migrate",
  "cmd/outbox-relay",
  "cmd/reminder-dispatcher",
  "cmd/appeal-notification-dispatcher",
  "cmd/content-report-restriction-dispatcher",
  "cmd/route-participation-reconciler",
  "bookway/bbs-search/bg/bbs-indexer",
  "infra/data",
  "infra/event",
  "infra/runtime",
  "pkg/api",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
futures = "0.3"
http-body-util = "0.1"
jsonwebtoken = "9"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
redis = { version = "0.32", features = ["connection-manager", "tokio-comp"] }
rusty-s3 = "0.8"
kafka = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio-rustls", "time", "uuid"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
tonic-health = "0.12"
tonic-build = "0.12"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v7"] }
url = "2"

bookway-api = { path = "pkg/api" }
bookway-data = { path = "infra/data" }
bookway-event = { path = "infra/event" }
bookway-runtime = { path = "infra/runtime" }
bookway-recommend-recall = { path = "bookway/recommend-recall" }
bookway-recommend-rank = { path = "bookway/recommend-rank" }
bookway-recommend-main = { path = "bookway/recommend-main" }
bookway-bbs = { path = "bookway/bbs" }
bookway-bbs-link = { path = "bookway/bbs-link" }
bookway-bbs-search = { path = "bookway/bbs-search" }
bookway-bbs-feed = { path = "bookway/bbs-feed" }
bookway-comment = { path = "bookway/comment" }
bookway-commonlikestatus = { path = "bookway/commonlikestatus" }
bookway-content-audit = { path = "bookway/content-audit" }
bookway-feature-main = { path = "bookway/feature-main" }
bookway-growth = { path = "bookway/growth" }
bookway-media = { path = "bookway/media" }
bookway-search-main = { path = "bookway/search-main" }
bookway-user-event = { path = "bookway/user-event" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
