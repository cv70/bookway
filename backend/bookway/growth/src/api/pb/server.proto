syntax = "proto3";
package bookway.growth;

message UserRequest { string user_id = 1; }
message ScheduleRequest { string user_id = 1; string local_date = 2; string timezone = 3; }
message CreateJourneyRequest { string user_id = 1; string request_json = 2; }
message CreateRouteJourneyRequest { string user_id = 1; string route_id = 2; string request_json = 3; }
message SetRouteParticipationIntentRequest { string user_id = 1; string route_id = 2; bool active = 3; string private_journey_id = 4; }
message JourneyRequest { string user_id = 1; string journey_id = 2; }
message UpdateJourneyRequest { string user_id = 1; string journey_id = 2; string request_json = 3; }
message CreateActionRequest { string user_id = 1; string request_json = 2; }
message CompleteActionRequest { string user_id = 1; string action_id = 2; }
message UpdateActionRequest { string user_id = 1; string action_id = 2; string request_json = 3; }
message PushDeviceRequest { string user_id = 1; string device_id = 2; }
message UpdateReminderPreferencesRequest { string user_id = 1; string request_json = 2; }
message RegisterPushDeviceRequest { string user_id = 1; string request_json = 2; }
message NotificationQueryRequest { string user_id = 1; string request_json = 2; }
message NotificationRequest { string user_id = 1; string notification_id = 2; }
message CreateNotificationRequest { string user_id = 1; string request_json = 2; }
message CreateEntryRequest { string user_id = 1; string request_json = 2; }
message KnowledgeQueryRequest { string user_id = 1; string request_json = 2; }
message CreateKnowledgeRequest { string user_id = 1; string request_json = 2; string idempotency_key = 3; }
message UpdateKnowledgeRequest { string user_id = 1; string resource_id = 2; string request_json = 3; }
message JsonResponse { string response_json = 1; }

service Growth {
  rpc ListJourneys(UserRequest) returns (JsonResponse);
  rpc CreateJourney(CreateJourneyRequest) returns (JsonResponse);
  rpc CreateRouteJourney(CreateRouteJourneyRequest) returns (JsonResponse);
  rpc SetRouteParticipationIntent(SetRouteParticipationIntentRequest) returns (JsonResponse);
  rpc GetJourney(JourneyRequest) returns (JsonResponse);
  rpc UpdateJourney(UpdateJourneyRequest) returns (JsonResponse);
  rpc CreateAction(CreateActionRequest) returns (JsonResponse);
  rpc Today(ScheduleRequest) returns (JsonResponse);
  rpc CompleteAction(CompleteActionRequest) returns (JsonResponse);
  rpc UpdateAction(UpdateActionRequest) returns (JsonResponse);
  rpc ReminderPreferences(UserRequest) returns (JsonResponse);
  rpc UpdateReminderPreferences(UpdateReminderPreferencesRequest) returns (JsonResponse);
  rpc RegisterPushDevice(RegisterPushDeviceRequest) returns (JsonResponse);
  rpc RevokePushDevice(PushDeviceRequest) returns (JsonResponse);
  rpc ListNotifications(NotificationQueryRequest) returns (JsonResponse);
  rpc CreateNotification(CreateNotificationRequest) returns (JsonResponse);
  rpc MarkNotificationRead(NotificationRequest) returns (JsonResponse);
  rpc ListEntries(UserRequest) returns (JsonResponse);
  rpc CreateEntry(CreateEntryRequest) returns (JsonResponse);
  rpc WeeklyReview(UserRequest) returns (JsonResponse);
  rpc Companion(ScheduleRequest) returns (JsonResponse);
  rpc ListKnowledge(KnowledgeQueryRequest) returns (JsonResponse);
  rpc CreateKnowledge(CreateKnowledgeRequest) returns (JsonResponse);
  rpc UpdateKnowledge(UpdateKnowledgeRequest) returns (JsonResponse);
}
