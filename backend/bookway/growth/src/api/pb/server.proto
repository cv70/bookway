syntax = "proto3";
package bookway.growth;

message UserRequest { string user_id = 1; }
message CreateJourneyRequest { string user_id = 1; string request_json = 2; }
message CompleteActionRequest { string user_id = 1; string action_id = 2; }
message JsonResponse { string response_json = 1; }

service Growth {
  rpc ListJourneys(UserRequest) returns (JsonResponse);
  rpc CreateJourney(CreateJourneyRequest) returns (JsonResponse);
  rpc Today(UserRequest) returns (JsonResponse);
  rpc CompleteAction(CompleteActionRequest) returns (JsonResponse);
}
