syntax = "proto3";
package bookway.growth;

enum GrowthDomain { GROWTH_DOMAIN_LEARNING = 0; GROWTH_DOMAIN_MOVEMENT = 1; GROWTH_DOMAIN_WELLNESS = 2; GROWTH_DOMAIN_TRAVEL = 3; GROWTH_DOMAIN_LEISURE = 4; }
enum JourneyStatus { JOURNEY_STATUS_ACTIVE = 0; JOURNEY_STATUS_PAUSED = 1; JOURNEY_STATUS_COMPLETED = 2; }
enum JourneyType { JOURNEY_TYPE_HABIT = 0; JOURNEY_TYPE_PROJECT = 1; JOURNEY_TYPE_QUANTITY = 2; JOURNEY_TYPE_TRAVEL = 3; JOURNEY_TYPE_CHALLENGE = 4; }
enum ActionState { ACTION_STATE_PENDING = 0; ACTION_STATE_COMPLETED = 1; ACTION_STATE_SKIPPED = 2; }
enum ActionRecurrenceFrequency { ACTION_RECURRENCE_FREQUENCY_DAILY = 0; ACTION_RECURRENCE_FREQUENCY_WEEKLY = 1; }
enum Weekday { WEEKDAY_MONDAY = 0; WEEKDAY_TUESDAY = 1; WEEKDAY_WEDNESDAY = 2; WEEKDAY_THURSDAY = 3; WEEKDAY_FRIDAY = 4; WEEKDAY_SATURDAY = 5; WEEKDAY_SUNDAY = 6; }
enum PushProvider { PUSH_PROVIDER_EXPO = 0; PUSH_PROVIDER_FCM = 1; PUSH_PROVIDER_APNS = 2; }
enum NotificationKind { NOTIFICATION_KIND_ACTION_REMINDER = 0; NOTIFICATION_KIND_COMMUNITY = 1; NOTIFICATION_KIND_SYSTEM = 2; }
enum EntryMood { ENTRY_MOOD_CLEAR = 0; ENTRY_MOOD_STEADY = 1; ENTRY_MOOD_TIRED = 2; ENTRY_MOOD_ENERGIZED = 3; ENTRY_MOOD_CALM = 4; }
enum EntryPublicationStatus { ENTRY_PUBLICATION_STATUS_PRIVATE = 0; ENTRY_PUBLICATION_STATUS_PENDING = 1; ENTRY_PUBLICATION_STATUS_REVIEWING = 2; ENTRY_PUBLICATION_STATUS_PUBLISHED = 3; ENTRY_PUBLICATION_STATUS_RESTRICTED = 4; ENTRY_PUBLICATION_STATUS_FAILED = 5; }
enum ReviewAdjustmentKind { REVIEW_ADJUSTMENT_KIND_REDUCE_ACTION_DURATION = 0; REVIEW_ADJUSTMENT_KIND_RESCHEDULE_ACTION = 1; REVIEW_ADJUSTMENT_KIND_PAUSE_JOURNEY = 2; }
enum CompanionMode { COMPANION_MODE_START_SMALL = 0; COMPANION_MODE_KEEP_GOING = 1; COMPANION_MODE_CELEBRATE = 2; COMPANION_MODE_PLAN_NEXT = 3; }
enum KnowledgeResourceKind { KNOWLEDGE_RESOURCE_KIND_BOOK = 0; KNOWLEDGE_RESOURCE_KIND_ARTICLE = 1; KNOWLEDGE_RESOURCE_KIND_COURSE = 2; KNOWLEDGE_RESOURCE_KIND_VIDEO = 3; KNOWLEDGE_RESOURCE_KIND_LINK = 4; KNOWLEDGE_RESOURCE_KIND_NOTE = 5; }
enum KnowledgeResourceStatus { KNOWLEDGE_RESOURCE_STATUS_INBOX = 0; KNOWLEDGE_RESOURCE_STATUS_ACTIVE = 1; KNOWLEDGE_RESOURCE_STATUS_COMPLETED = 2; KNOWLEDGE_RESOURCE_STATUS_ARCHIVED = 3; }

message ActionRecurrence { ActionRecurrenceFrequency frequency = 1; uint32 interval = 2; repeated Weekday weekdays = 3; optional string ends_on = 4; optional string anchor_date = 5; }
message JourneyStage { string id = 1; string title = 2; string detail = 3; string completion_criteria = 4; uint32 position = 5; }
message JourneyStageInput { string title = 1; string detail = 2; string completion_criteria = 3; }
message Journey { string id = 1; string title = 2; string intent = 3; GrowthDomain domain = 4; JourneyType journey_type = 5; string completion_criteria = 6; repeated JourneyStage stages = 7; JourneyStatus status = 8; uint32 progress = 9; string duration_label = 10; string next_action = 11; uint32 participant_count = 12; }
message Action { string id = 1; string journey_id = 2; optional string stage_id = 3; string title = 4; string detail = 5; uint32 estimated_minutes = 6; string scheduled_label = 7; optional string scheduled_for = 8; optional string scheduled_timezone = 9; optional ActionRecurrence recurrence = 10; ActionState state = 11; }
message TodaySummary { uint32 completed = 1; uint32 total = 2; uint32 focus_minutes = 3; repeated Action actions = 4; }
message JourneyDetail { Journey journey = 1; repeated Action actions = 2; }
message ReminderPreference { bool enabled = 1; uint32 lead_minutes = 2; string timezone = 3; optional string quiet_hours_start = 4; optional string quiet_hours_end = 5; string updated_at = 6; }
message PushDevice { string device_id = 1; PushProvider provider = 2; bool active = 3; string updated_at = 4; }
message UserNotification { string id = 1; NotificationKind kind = 2; string source_id = 3; string title = 4; string body = 5; map<string, string> data = 6; optional string read_at = 7; string created_at = 8; }
message NotificationPage { repeated UserNotification items = 1; optional string next_cursor = 2; uint32 unread_count = 3; }
message GrowthEntry { string id = 1; optional string action_id = 2; optional string journey_id = 3; string body = 4; EntryMood mood = 5; optional uint32 duration_minutes = 6; optional string quantity = 7; optional string location = 8; optional string photo_url = 9; string created_at = 10; bool published = 11; EntryPublicationStatus publication_status = 12; optional string public_content_id = 13; optional string publication_error = 14; optional string photo_media_id = 15; }
message ReviewDomainProgress { GrowthDomain domain = 1; uint32 completed_actions = 2; uint32 total_actions = 3; }
message ReviewActionPatch { string action_id = 1; optional uint32 estimated_minutes = 2; optional string scheduled_label = 3; }
message ReviewJourneyPatch { string journey_id = 1; JourneyStatus status = 2; }
message ReviewAdjustmentSuggestion { ReviewAdjustmentKind kind = 1; string title = 2; string rationale = 3; optional ReviewActionPatch action_patch = 4; optional ReviewJourneyPatch journey_patch = 5; }
message WeeklyReviewSummary { string period_start = 1; string period_end = 2; uint32 completed_actions = 3; uint32 skipped_actions = 4; uint32 focus_minutes = 5; uint32 entry_count = 6; uint32 active_journeys = 7; double completion_rate = 8; repeated ReviewDomainProgress domains = 9; repeated string reflection_prompts = 10; repeated ReviewAdjustmentSuggestion adjustment_suggestions = 11; }
message CompanionBrief { CompanionMode mode = 1; string headline = 2; string message = 3; string reason = 4; optional Action suggested_action = 5; optional uint32 suggested_minutes = 6; uint32 completed_actions = 7; uint32 total_actions = 8; uint32 active_journeys = 9; string reflection_prompt = 10; }
message KnowledgeResource { string id = 1; string title = 2; string creator = 3; string summary = 4; KnowledgeResourceKind kind = 5; KnowledgeResourceStatus status = 6; optional string source_url = 7; optional string body = 8; repeated string tags = 9; optional string journey_id = 10; uint32 progress = 11; uint32 current_position = 12; uint64 reading_seconds = 13; repeated string bookmarks = 14; string created_at = 15; string updated_at = 16; optional string last_opened_at = 17; optional string source_content_id = 18; }
message RouteParticipationIntent { string route_id = 1; bool desired_active = 2; optional string private_journey_id = 3; uint64 version = 4; }
message RouteActionTemplate { string title = 1; string detail = 2; uint32 estimated_minutes = 3; string scheduled_label = 4; optional uint32 stage_index = 5; }
message EmptyResponse {}

message UserRequest { string user_id = 1; }
message ScheduleRequest { string user_id = 1; optional string local_date = 2; optional string timezone = 3; }
message CreateJourneyRequest { string user_id = 1; string title = 2; string intent = 3; GrowthDomain domain = 4; JourneyType journey_type = 5; string completion_criteria = 6; repeated JourneyStageInput stages = 7; string duration_label = 8; string first_action_title = 9; string first_action_detail = 10; uint32 estimated_minutes = 11; optional string first_action_scheduled_label = 12; optional string first_action_scheduled_for = 13; optional string first_action_scheduled_timezone = 14; optional uint32 first_action_stage_index = 15; optional ActionRecurrence first_action_recurrence = 16; optional string idempotency_key = 17; }
message CreateRouteJourneyRequest { string user_id = 1; string route_id = 2; CreateJourneyRequest journey = 3; repeated RouteActionTemplate additional_actions = 4; }
message SetRouteParticipationIntentRequest { string user_id = 1; string route_id = 2; bool active = 3; optional string private_journey_id = 4; }
message JourneyRequest { string user_id = 1; string journey_id = 2; }
message UpdateJourneyRequest { string user_id = 1; string journey_id = 2; optional string title = 3; optional string intent = 4; optional string duration_label = 5; optional JourneyStatus status = 6; }
message CreateActionRequest { string user_id = 1; string journey_id = 2; optional string stage_id = 3; string title = 4; string detail = 5; uint32 estimated_minutes = 6; string scheduled_label = 7; optional string scheduled_for = 8; optional string scheduled_timezone = 9; optional ActionRecurrence recurrence = 10; optional string idempotency_key = 11; }
message CompleteActionRequest { string user_id = 1; string action_id = 2; }
// Source content identity is returned only to trusted callers so Gateway can
// record server-derived completion signals. It never enters the public HTTP action.
message CompleteActionResponse { Action action = 1; optional string source_route_id = 2; optional string source_knowledge_content_id = 3; }
message UpdateActionRequest { string user_id = 1; string action_id = 2; optional string title = 3; optional string detail = 4; optional uint32 estimated_minutes = 5; optional string scheduled_label = 6; optional string scheduled_for = 7; optional string scheduled_timezone = 8; optional ActionState state = 9; }
message UpdateReminderPreferencesRequest { string user_id = 1; bool enabled = 2; uint32 lead_minutes = 3; string timezone = 4; optional string quiet_hours_start = 5; optional string quiet_hours_end = 6; }
message RegisterPushDeviceRequest { string user_id = 1; string device_id = 2; PushProvider provider = 3; string endpoint = 4; }
message PushDeviceRequest { string user_id = 1; string device_id = 2; }
message NotificationQueryRequest { string user_id = 1; optional string cursor = 2; optional uint32 limit = 3; optional bool unread_only = 4; }
message NotificationRequest { string user_id = 1; string notification_id = 2; }
message CreateNotificationRequest { string user_id = 1; NotificationKind kind = 2; string source_id = 3; string title = 4; string body = 5; map<string, string> data = 6; }
message CreateEntryRequest { string user_id = 1; optional string action_id = 2; optional string journey_id = 3; string body = 4; EntryMood mood = 5; optional uint32 duration_minutes = 6; optional string quantity = 7; optional string location = 8; optional string photo_url = 9; bool published = 10; optional string photo_media_id = 11; optional string idempotency_key = 12; }
message RetryEntryPublicationRequest { string user_id = 1; string entry_id = 2; }
message KnowledgeQueryRequest { string user_id = 1; optional string q = 2; optional KnowledgeResourceKind kind = 3; optional KnowledgeResourceStatus status = 4; optional string tag = 5; }
message CreateKnowledgeRequest { string user_id = 1; optional string idempotency_key = 2; string title = 3; string creator = 4; string summary = 5; KnowledgeResourceKind kind = 6; KnowledgeResourceStatus status = 7; optional string source_url = 8; optional string body = 9; repeated string tags = 10; optional string journey_id = 11; optional string source_content_id = 12; }
// Starts a private Journey from one owned resource. The resource ID itself is
// the idempotency boundary: repeated calls return its already-linked Journey.
message StartKnowledgeJourneyRequest { string user_id = 1; string resource_id = 2; string title = 3; string intent = 4; GrowthDomain domain = 5; JourneyType journey_type = 6; string completion_criteria = 7; repeated JourneyStageInput stages = 8; string duration_label = 9; string first_action_title = 10; string first_action_detail = 11; uint32 estimated_minutes = 12; optional string first_action_scheduled_label = 13; optional string first_action_scheduled_for = 14; optional string first_action_scheduled_timezone = 15; optional uint32 first_action_stage_index = 16; optional ActionRecurrence first_action_recurrence = 17; }
message UpdateKnowledgeRequest { string user_id = 1; string resource_id = 2; optional string title = 3; optional string creator = 4; optional string summary = 5; optional KnowledgeResourceKind kind = 6; optional KnowledgeResourceStatus status = 7; optional string source_url = 8; optional string body = 9; optional StringList tags = 10; optional string journey_id = 11; optional uint32 progress = 12; optional uint32 current_position = 13; optional uint64 reading_seconds = 14; optional StringList bookmarks = 15; optional string last_opened_at = 16; }
message StringList { repeated string values = 1; }
message JourneyList { repeated Journey items = 1; }
message ActionList { repeated Action items = 1; }
message EntryList { repeated GrowthEntry items = 1; }
message KnowledgeList { repeated KnowledgeResource items = 1; }
message KnowledgeJourney { KnowledgeResource resource = 1; JourneyDetail journey = 2; }

service Growth {
  rpc ListJourneys(UserRequest) returns (JourneyList); rpc CreateJourney(CreateJourneyRequest) returns (Journey); rpc CreateRouteJourney(CreateRouteJourneyRequest) returns (Journey); rpc SetRouteParticipationIntent(SetRouteParticipationIntentRequest) returns (RouteParticipationIntent); rpc GetJourney(JourneyRequest) returns (JourneyDetail); rpc UpdateJourney(UpdateJourneyRequest) returns (Journey); rpc CreateAction(CreateActionRequest) returns (Action); rpc Today(ScheduleRequest) returns (TodaySummary); rpc CompleteAction(CompleteActionRequest) returns (CompleteActionResponse); rpc UpdateAction(UpdateActionRequest) returns (Action); rpc ReminderPreferences(UserRequest) returns (ReminderPreference); rpc UpdateReminderPreferences(UpdateReminderPreferencesRequest) returns (ReminderPreference); rpc RegisterPushDevice(RegisterPushDeviceRequest) returns (PushDevice); rpc RevokePushDevice(PushDeviceRequest) returns (EmptyResponse); rpc ListNotifications(NotificationQueryRequest) returns (NotificationPage); rpc CreateNotification(CreateNotificationRequest) returns (UserNotification); rpc MarkNotificationRead(NotificationRequest) returns (UserNotification); rpc ListEntries(UserRequest) returns (EntryList); rpc CreateEntry(CreateEntryRequest) returns (GrowthEntry); rpc RetryEntryPublication(RetryEntryPublicationRequest) returns (GrowthEntry); rpc WeeklyReview(UserRequest) returns (WeeklyReviewSummary); rpc Companion(ScheduleRequest) returns (CompanionBrief); rpc ListKnowledge(KnowledgeQueryRequest) returns (KnowledgeList); rpc CreateKnowledge(CreateKnowledgeRequest) returns (KnowledgeResource); rpc StartKnowledgeJourney(StartKnowledgeJourneyRequest) returns (KnowledgeJourney); rpc UpdateKnowledge(UpdateKnowledgeRequest) returns (KnowledgeResource);
}
