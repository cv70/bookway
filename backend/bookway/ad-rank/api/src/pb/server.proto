syntax = "proto3";
package bookway.ad.rank;
import "ad-center/api/src/pb/server.proto";
message RankedCampaign { bookway.ad.center.AdCampaign campaign = 1; double score = 2; }
message RankRequest { string user_id = 1; string domain = 2; repeated bookway.ad.center.AdCampaign candidates = 3; }
message RankResponse { repeated RankedCampaign items = 1; string model_version = 2; bool degraded = 3; }
service AdRank { rpc Rank(RankRequest) returns (RankResponse); }
