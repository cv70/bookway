syntax = "proto3";
package bookway.media;

message CreateUploadRequest { string user_id = 1; string request_json = 2; }
message ResourceRequest { string user_id = 1; string id = 2; }
message JsonResponse { string response_json = 1; }

service Media {
  rpc CreateUpload(CreateUploadRequest) returns (JsonResponse);
  rpc CompleteUpload(ResourceRequest) returns (JsonResponse);
  rpc Get(ResourceRequest) returns (JsonResponse);
}
