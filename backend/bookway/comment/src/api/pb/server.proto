syntax = "proto3";
package bookway.comment;

message ListRequest { string post_id = 1; string request_json = 2; }
message CreateRequest {
  string user_id = 1;
  string post_id = 2;
  string request_json = 3;
  optional string idempotency_key = 4;
}
message DeleteRequest {
  string user_id = 1;
  string post_id = 2;
  string comment_id = 3;
}
message JsonResponse { string response_json = 1; }

service Comment {
  rpc List(ListRequest) returns (JsonResponse);
  rpc Create(CreateRequest) returns (JsonResponse);
  rpc Delete(DeleteRequest) returns (JsonResponse);
}
