syntax = "proto3";
package bookway.mall;

enum MallProductStatus {
  MALL_PRODUCT_STATUS_DRAFT = 0;
  MALL_PRODUCT_STATUS_ACTIVE = 1;
  MALL_PRODUCT_STATUS_ARCHIVED = 2;
}

message MallSku {
  string id = 1;
  string product_id = 2;
  string title = 3;
  int64 price_cents = 4;
  string currency = 5;
  map<string, string> attributes = 6;
  bool saleable = 7;
}

message MallProduct {
  string id = 1;
  string title = 2;
  string description = 3;
  string image_url = 4;
  MallProductStatus status = 5;
  repeated MallSku skus = 6;
  string created_at = 7;
  string updated_at = 8;
}

message CreateSkuRequest {
  string title = 1;
  int64 price_cents = 2;
  string currency = 3;
  map<string, string> attributes = 4;
  bool saleable = 5;
}

message CreateProductRequest {
  string merchant_id = 1;
  string title = 2;
  string description = 3;
  string image_url = 4;
  MallProductStatus status = 5;
  repeated CreateSkuRequest skus = 6;
}

message Attributes {
  map<string, string> values = 1;
}

message UpdateSkuRequest {
  string sku_id = 1;
  optional string title = 2;
  optional int64 price_cents = 3;
  optional string currency = 4;
  optional Attributes attributes = 5;
  optional bool saleable = 6;
}

message UpdateProductRequest {
  string merchant_id = 1;
  string product_id = 2;
  optional string title = 3;
  optional string description = 4;
  optional string image_url = 5;
  optional MallProductStatus status = 6;
  repeated UpdateSkuRequest sku_updates = 7;
}

message ProductQueryRequest {
  optional string merchant_id = 1;
  optional string cursor = 2;
  optional uint32 limit = 3;
  optional string query = 4;
  bool include_inactive = 5;
}

message ProductPage {
  repeated MallProduct items = 1;
  optional string next_cursor = 2;
}

message IdRequest { string id = 1; }
message SkuIdsRequest { repeated string ids = 1; }
message SkuListResponse { repeated MallSku items = 1; }

// A contextual offer is attached to a public route action node.  The mall
// owns this association so content services never need to copy product facts.
message NodeOffer {
  string id = 1;
  string product_id = 2;
  string sku_id = 3;
  string route_id = 4;
  string action_node_id = 5;
  string creator_id = 6;
  uint32 commission_bps = 7;
  string created_at = 8;
  // Equipment is part of the action context, never an optional marketing tag.
  string scene_equipment = 9;
  // Public offer queries resolve display data here so clients cannot fall back
  // to a context-free catalog endpoint.
  optional MallProduct product = 10;
  // Immutable merchant ownership used by order and settlement snapshots.
  string merchant_id = 11;
}

message AttachNodeOfferRequest {
  string merchant_id = 1;
  string product_id = 2;
  string sku_id = 3;
  string route_id = 4;
  string action_node_id = 5;
  string creator_id = 6;
  uint32 commission_bps = 7;
  string idempotency_key = 8;
  string scene_equipment = 9;
}

message NodeOfferQueryRequest {
  string route_id = 1;
  string action_node_id = 2;
  optional uint32 limit = 3;
}

message NodeOfferList { repeated NodeOffer items = 1; }

service Mall {
  rpc CreateProduct(CreateProductRequest) returns (MallProduct);
  rpc UpdateProduct(UpdateProductRequest) returns (MallProduct);
  rpc Products(ProductQueryRequest) returns (ProductPage);
  rpc Product(IdRequest) returns (MallProduct);
  rpc Skus(SkuIdsRequest) returns (SkuListResponse);
  rpc AttachNodeOffer(AttachNodeOfferRequest) returns (NodeOffer);
  rpc NodeOffers(NodeOfferQueryRequest) returns (NodeOfferList);
  // Checkout must resolve a currently public route action and declared scene
  // equipment. Historical settlement reads use GetNodeOffer instead.
  rpc GetCheckoutNodeOffer(IdRequest) returns (NodeOffer);
  rpc GetNodeOffer(IdRequest) returns (NodeOffer);
}
