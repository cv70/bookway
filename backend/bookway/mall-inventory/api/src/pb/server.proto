syntax = "proto3";
package bookway.mall.inventory;
message SetStockRequest {
  string sku_id = 1;
  int64 available = 2;
}

message IdRequest { string id = 1; }
message BatchRequest { uint32 limit = 1; }

message InventoryItem {
  string sku_id = 1;
  int64 available = 2;
  int64 reserved = 3;
  string updated_at = 4;
}

message ReservationLine {
  string sku_id = 1;
  uint32 quantity = 2;
}

message ReserveRequest {
  string reservation_id = 1;
  repeated ReservationLine items = 2;
  optional uint64 ttl_seconds = 3;
}

message Reservation {
  string id = 1;
  string status = 2;
  string expires_at = 3;
  repeated ReservationLine items = 4;
}

message ExpireReservationsResponse { uint32 expired = 1; }

service MallInventory {
  rpc SetStock(SetStockRequest) returns (InventoryItem);
  rpc Stock(IdRequest) returns (InventoryItem);
  rpc Reserve(ReserveRequest) returns (Reservation);
  rpc Confirm(IdRequest) returns (Reservation);
  rpc Release(IdRequest) returns (Reservation);
  rpc ExpireReservations(BatchRequest) returns (ExpireReservationsResponse);
}
