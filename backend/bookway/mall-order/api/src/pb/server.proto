syntax = "proto3";
package bookway.mall.order;

enum MallOrderStatus {
  MALL_ORDER_STATUS_PENDING_PAYMENT = 0;
  MALL_ORDER_STATUS_PAID = 1;
  MALL_ORDER_STATUS_CANCELLED = 2;
  MALL_ORDER_STATUS_EXPIRED = 3;
  MALL_ORDER_STATUS_PAYMENT_PROCESSING = 4;
  // The payment provider confirmed the money after the order's payment TTL
  // already expired the order. Money has moved, so the state is honestly
  // distinct from `paid`: fulfillment and affiliate settlement are NOT started
  // automatically — operations decides refund vs. fulfill per order.
  MALL_ORDER_STATUS_PAID_AFTER_EXPIRY = 5;
}

enum FulfillmentStatus {
  FULFILLMENT_STATUS_PENDING = 0;
  FULFILLMENT_STATUS_PROCESSING = 1;
  FULFILLMENT_STATUS_SHIPPED = 2;
  FULFILLMENT_STATUS_DELIVERED = 3;
  FULFILLMENT_STATUS_CANCELLED = 4;
}

enum AffiliateSettlementStatus {
  AFFILIATE_SETTLEMENT_STATUS_PENDING = 0;
  AFFILIATE_SETTLEMENT_STATUS_ELIGIBLE = 1;
  AFFILIATE_SETTLEMENT_STATUS_SETTLED = 2;
  AFFILIATE_SETTLEMENT_STATUS_REVERSED = 3;
}

message OrderItemRequest {
  string sku_id = 1;
  uint32 quantity = 2;
}

message CreateRequest {
  string user_id = 1;
  string idempotency_key = 2;
  repeated OrderItemRequest items = 3;
  // Orders originate from an offer shown at a route action node; direct SKU
  // checkout is intentionally not part of the commerce model.
  string node_offer_id = 4;
  // Ad decision context captured from the creative that led to this
  // checkout. Recorded on the order and reported to ad-center as a
  // server-side conversion only when the payment is VERIFIED — the client
  // can never assert the conversion itself.
  optional AdAttribution ad_attribution = 5;
}

message AdAttribution {
  // Ad decision request id from the served FeedAd/SearchAd.
  string request_id = 1;
  // Campaign that owned the served creative.
  string campaign_id = 2;
}

message OrderLine {
  string sku_id = 1;
  string product_id = 2;
  string title = 3;
  uint32 quantity = 4;
  int64 unit_price_cents = 5;
  string currency = 6;
  int64 line_total_cents = 7;
}

message Order {
  string id = 1;
  string user_id = 2;
  MallOrderStatus status = 3;
  string currency = 4;
  int64 total_cents = 5;
  repeated OrderLine items = 6;
  optional string payment_reference = 7;
  string expires_at = 8;
  string created_at = 9;
  string updated_at = 10;
  string node_offer_id = 11;
  string affiliate_creator_id = 12;
  int64 commission_cents = 13;
  // Immutable merchant snapshot from the contextual NodeOffer.
  string merchant_id = 14;
  FulfillmentStatus fulfillment_status = 15;
  string tracking_number = 16;
  // Ad decision context this order is attributed to (see CreateRequest).
  optional AdAttribution ad_attribution = 17;
}

message OrderListResponse { repeated Order items = 1; }
message ExpirePendingResponse { uint32 scanned = 1; uint32 expired = 2; uint32 failed = 3; }
message PromoteAffiliateSettlementsResponse { uint64 promoted = 1; }
// Payment-provider webhook confirmation: the gateway verifies the provider's
// signature, then drives the same idempotent Pay state machine by reference.
message ConfirmByReferenceRequest { string payment_reference = 1; }

message UserRequest { string user_id = 1; }
message OrderRequest { string user_id = 1; string order_id = 2; }
message PayRequest { string user_id = 1; string order_id = 2; string payment_reference = 3; }
message BatchRequest { uint32 limit = 1; }

message MerchantOrderRequest {
  string merchant_id = 1;
  optional MallOrderStatus status = 2;
  optional string cursor = 3;
  optional uint32 limit = 4;
}
message MerchantOrderListResponse { repeated Order items = 1; optional string next_cursor = 2; }
message UpdateFulfillmentRequest {
  string merchant_id = 1;
  string order_id = 2;
  FulfillmentStatus status = 3;
  string tracking_number = 4;
}
message AffiliateSettlement {
  string id = 1;
  string order_id = 2;
  string merchant_id = 3;
  string creator_id = 4;
  int64 amount_cents = 5;
  AffiliateSettlementStatus status = 6;
  string eligible_at = 7;
  optional string settled_at = 8;
  string created_at = 9;
}
message AffiliateSettlementRequest {
  string merchant_id = 1;
  optional AffiliateSettlementStatus status = 2;
  optional string cursor = 3;
  optional uint32 limit = 4;
}
// Creator-facing settlement listing. The creator only ever reads rows
// attributed to their own id (the gateway stamps it from the authenticated
// identity); every AffiliateSettlement field stays visible, including the
// merchant_id that tells the creator which shop the share came from.
message CreatorSettlementRequest {
  string creator_id = 1;
  optional AffiliateSettlementStatus status = 2;
  optional string cursor = 3;
  optional uint32 limit = 4;
}
message AffiliateSettlementListResponse {
  repeated AffiliateSettlement items = 1;
  optional string next_cursor = 2;
}
message SettleAffiliateRequest { string merchant_id = 1; string settlement_id = 2; }

// Refund-path entry point: reverses the affiliate share of an order whose
// payment is being returned. Idempotent — replaying a reversal returns the
// already reversed settlement.
message ReverseAffiliateRequest { string order_id = 1; }

service MallOrder {
  rpc Create(CreateRequest) returns (Order);
  rpc List(UserRequest) returns (OrderListResponse);
  rpc Get(OrderRequest) returns (Order);
  rpc Pay(PayRequest) returns (Order);
  rpc Cancel(OrderRequest) returns (Order);
  rpc ExpirePending(BatchRequest) returns (ExpirePendingResponse);
  rpc MerchantOrders(MerchantOrderRequest) returns (MerchantOrderListResponse);
  rpc UpdateFulfillment(UpdateFulfillmentRequest) returns (Order);
  rpc AffiliateSettlements(AffiliateSettlementRequest) returns (AffiliateSettlementListResponse);
  // Creator-facing read of the same ledger, keyed by creator_id. Rows are the
  // existing AffiliateSettlement messages; no merchant-only actions (settle,
  // fulfillment) are reachable through it.
  rpc ListCreatorSettlements(CreatorSettlementRequest) returns (AffiliateSettlementListResponse);
  rpc SettleAffiliate(SettleAffiliateRequest) returns (AffiliateSettlement);
  // Service-to-service hook for the future refund money channel. Reversing is
  // an internal ledger fact, not a merchant dashboard action.
  rpc ReverseAffiliate(ReverseAffiliateRequest) returns (AffiliateSettlement);
  // Called by the expirer worker: flips pending creator shares whose refund
  // window has elapsed to eligible, so merchants can pay them out.
  rpc PromoteAffiliateSettlements(BatchRequest) returns (PromoteAffiliateSettlementsResponse);
  rpc ConfirmByReference(ConfirmByReferenceRequest) returns (Order);
}
