syntax = "proto3";
package bookway.bbs.link;

message ListRequest { string request_json = 1; }
message IdRequest { string id = 1; }
message CreateRequest { string user_id = 1; string request_json = 2; string idempotency_key = 3; }
message UpdateRequest { string user_id = 1; string id = 2; string request_json = 3; }
message PublishRequest { string user_id = 1; string id = 2; }
message JsonResponse { string response_json = 1; }

service BbsLink {
  rpc List(ListRequest) returns (JsonResponse);
  rpc Get(IdRequest) returns (JsonResponse);
  rpc GetPublic(IdRequest) returns (JsonResponse);
  rpc Create(CreateRequest) returns (JsonResponse);
  rpc Update(UpdateRequest) returns (JsonResponse);
  rpc Publish(PublishRequest) returns (JsonResponse);
}
