syntax = "proto3";
package bookway.recommend.rank;

message Candidate { string content_id = 1; string post_json = 2; string author_id = 3; string status = 4; double quality_score = 5; double freshness = 6; double recall_score = 7; double score = 8; string source = 9; repeated string reasons = 10; }
message RankRequest { string user_id = 1; string features_json = 2; repeated Candidate candidates = 3; }
message RankResponse { repeated Candidate candidates = 1; string model_version = 2; string experiment_bucket = 3; bool degraded = 4; }
service RecommendRank { rpc Rank(RankRequest) returns (RankResponse); }
