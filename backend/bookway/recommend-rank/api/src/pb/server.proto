syntax = "proto3";
package bookway.recommend.rank;

import "recommend-recall/api/src/pb/server.proto";

message CandidateFeatures {
  string content_id = 1;
  double domain_affinity = 2;
  double author_affinity = 3;
  double impression_fatigue = 4;
  double direct_negative_feedback = 5;
  double click_through_rate = 6;
  double save_rate = 7;
  double action_completion_rate = 8;
  double purchase_conversion_rate = 9;
  // Calibrated objective predictions used by the online multi-objective ranker.
  double p_ctr = 10;
  double p_cvr = 11;
  double p_wegu = 12;
  double route_completion_rate = 13;
}
message RankFeatures {
  double recent_positive_rate = 1;
  double user_interest_strength = 2;
  double negative_feedback_rate = 3;
  repeated CandidateFeatures candidates = 4;
}
message RankRequest {
  string user_id = 1;
  RankFeatures features = 2;
  repeated bookway.recommend.recall.Candidate candidates = 3;
  // Human-readable serving context for the LLM scorer (interests, surface,
  // social proof). Composed by recommend-main from hydrated facts only.
  string user_context = 4;
}
message RankResponse { repeated bookway.recommend.recall.Candidate candidates = 1; string model_version = 2; string experiment_bucket = 3; bool degraded = 4; }
service RecommendRank { rpc Rank(RankRequest) returns (RankResponse); }
