syntax = "proto3";
package bookway.ad.center;

enum CampaignStatus { CAMPAIGN_STATUS_DRAFT = 0; CAMPAIGN_STATUS_ACTIVE = 1; CAMPAIGN_STATUS_PAUSED = 2; CAMPAIGN_STATUS_ENDED = 3; }
enum PricingModel { PRICING_MODEL_CPM = 0; PRICING_MODEL_CPC = 1; }
enum EventType { EVENT_TYPE_IMPRESSION = 0; EVENT_TYPE_CLICK = 1; }
message StringList { repeated string values = 1; }
message AdCampaign {
  string id = 1; string advertiser_id = 2; string name = 3; string placement = 4;
  string title = 5; string body = 6; string image_url = 7; string landing_url = 8;
  repeated string target_domains = 9; CampaignStatus status = 10; PricingModel pricing_model = 11;
  int64 bid_micros = 12; int64 daily_budget_micros = 13; int64 spent_today_micros = 14;
  uint32 frequency_cap = 15; uint64 impressions = 16; uint64 clicks = 17;
  optional string starts_at = 18; optional string ends_at = 19; string created_at = 20; string updated_at = 21;
  double predicted_ctr = 22; double predicted_cvr = 23; uint32 global_frequency_cap = 24;
  string route_id = 25; string action_node_id = 26;
  string scene_equipment = 27;
  // Empty arrays mean unrestricted; a delivery request with an unknown
  // region/os only matches campaigns that declare no restriction.
  repeated string geo_regions = 28; repeated string device_os = 29;
}
message CreateCampaignRequest {
  string advertiser_id = 1; string name = 2; string placement = 3; string title = 4;
  string body = 5; string image_url = 6; string landing_url = 7; repeated string target_domains = 8;
  PricingModel pricing_model = 9; int64 bid_micros = 10; int64 daily_budget_micros = 11;
  uint32 frequency_cap = 12; optional string starts_at = 13; optional string ends_at = 14;
  double predicted_ctr = 15; double predicted_cvr = 16; uint32 global_frequency_cap = 17;
  string route_id = 18; string action_node_id = 19;
  string scene_equipment = 20;
  repeated string geo_regions = 21; repeated string device_os = 22;
}
message UpdateCampaignRequest {
  string campaign_id = 1; optional CampaignStatus status = 2; optional string name = 3;
  optional string title = 4; optional string body = 5; optional string image_url = 6;
  optional string landing_url = 7; optional StringList target_domains = 8;
  optional int64 bid_micros = 9; optional int64 daily_budget_micros = 10;
  optional uint32 frequency_cap = 11; optional string starts_at = 12; optional string ends_at = 13;
  optional double predicted_ctr = 14; optional double predicted_cvr = 15; optional uint32 global_frequency_cap = 16;
  string advertiser_id = 17;
  optional string scene_equipment = 18;
  optional StringList geo_regions = 19; optional StringList device_os = 20;
}
message CampaignIdRequest { string campaign_id = 1; string advertiser_id = 2; }
message AdvertiserCampaignQuery { string advertiser_id = 1; optional uint32 limit = 2; }
message EligibleRequest { string user_id = 1; string placement = 2; string domain = 3; uint32 limit = 4; string route_id = 5; string action_node_id = 6; string scene_equipment = 7; string geo_region = 8; string device_os = 9; }
message CampaignList { repeated AdCampaign items = 1; }
message RecordEventRequest { string user_id = 1; string event_id = 2; string request_id = 3; string campaign_id = 4; EventType event_type = 5; }
message RegisterDecisionRequest { string user_id = 1; string request_id = 2; string placement = 3; repeated string campaign_ids = 4; string route_id = 5; string action_node_id = 6; string scene_equipment = 7; }
message EventReceipt { string event_id = 1; bool accepted = 2; bool duplicate = 3; }
message EmptyResponse {}
message GetDeliveryGuardrailsRequest {}
// Only scopes whose enforcement exists server-side belong here; knobs without
// a serving-side effect stay out of the contract instead of pretending.
message DeliveryGuardrails { uint32 user_daily_total_cap = 1; }
message AdDeliveryReportRequest { string advertiser_id = 1; string from_date = 2; string to_date = 3; }
message AdDeliveryReportRow { string campaign_id = 1; string stat_date = 2; int64 impressions = 3; int64 clicks = 4; int64 spent_micros = 5; }
message AdDeliveryReport { repeated AdDeliveryReportRow rows = 1; }

service AdCenter {
  rpc CreateCampaign(CreateCampaignRequest) returns (AdCampaign);
  rpc UpdateCampaign(UpdateCampaignRequest) returns (AdCampaign);
  rpc Campaign(CampaignIdRequest) returns (AdCampaign);
  rpc Campaigns(AdvertiserCampaignQuery) returns (CampaignList);
  rpc Eligible(EligibleRequest) returns (CampaignList);
  rpc RegisterDecisions(RegisterDecisionRequest) returns (EmptyResponse);
  rpc RecordEvent(RecordEventRequest) returns (EventReceipt);
  rpc GetDeliveryGuardrails(GetDeliveryGuardrailsRequest) returns (DeliveryGuardrails);
  rpc SetUserDailyTotalCap(DeliveryGuardrails) returns (DeliveryGuardrails);
  rpc DeliveryReport(AdDeliveryReportRequest) returns (AdDeliveryReport);
}
