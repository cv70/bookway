syntax = "proto3";
package bookway.bbs.search;

import "bbs-link/api/src/pb/server.proto";

enum SearchType {
  SEARCH_TYPE_ALL = 0;
  SEARCH_TYPE_POSTS = 1;
  SEARCH_TYPE_JOURNEYS = 2;
  SEARCH_TYPE_USERS = 3;
  SEARCH_TYPE_TOPICS = 4;
  SEARCH_TYPE_RESOURCES = 5;
}

enum SearchResultType {
  SEARCH_RESULT_TYPE_POST = 0;
  SEARCH_RESULT_TYPE_JOURNEY = 1;
  SEARCH_RESULT_TYPE_USER = 2;
  SEARCH_RESULT_TYPE_TOPIC = 3;
  SEARCH_RESULT_TYPE_RESOURCE = 4;
}

enum GrowthDomain {
  GROWTH_DOMAIN_UNSPECIFIED = 0;
  GROWTH_DOMAIN_LEARNING = 1;
  GROWTH_DOMAIN_MOVEMENT = 2;
  GROWTH_DOMAIN_WELLNESS = 3;
  GROWTH_DOMAIN_TRAVEL = 4;
  GROWTH_DOMAIN_LEISURE = 5;
}

message SearchRequest {
  string q = 1;
  SearchType search_type = 2;
  optional string cursor = 3;
  optional uint32 limit = 4;
  optional string user_id = 5;
  repeated string excluded_author_ids = 6;
  optional string session_id = 7;
}

message SuggestionsRequest {
  string q = 1;
  optional string user_id = 2;
  repeated string excluded_author_ids = 3;
}

message PostSummary {
  string id = 1;
  string author_name = 2;
  string author_avatar_url = 3;
  string title = 4;
  string summary = 5;
  GrowthDomain domain = 6;
  string cover_url = 7;
  string route_title = 8;
  string route_duration = 9;
  uint32 join_count = 10;
  uint32 like_count = 11;
  double freshness = 12;
  repeated string tags = 13;
  bool is_route = 14;
  bool is_milestone = 15;
  bool is_question = 16;
  // Public route action nodes available for the search result. The route ID
  // remains the enclosing SearchResult ID; callers can identify the matched
  // title or equipment locally without private execution data.
  repeated bookway.bbs.link.RouteTemplateAction route_actions = 17;
}

message ResourceSummary {
  string id = 1;
  string kind = 2;
  string provider = 3;
  string url = 4;
  string license = 5;
  string version = 6;
  string citation = 7;
  repeated string topics = 8;
  string published_at = 9;
  string updated_at = 10;
}

message SearchResult {
  string id = 1;
  SearchResultType result_type = 2;
  string title = 3;
  string snippet = 4;
  optional string cover_url = 5;
  optional string author_id = 6;
  optional string author_name = 7;
  optional GrowthDomain domain = 8;
  double score = 9;
  repeated string highlights = 10;
  optional PostSummary post = 11;
  optional ResourceSummary resource = 12;
}

message SearchResponse {
  string query = 1;
  repeated SearchResult items = 2;
  optional string next_cursor = 3;
  uint64 total_estimate = 4;
  uint64 took_ms = 5;
  bool degraded = 6;
  string request_id = 7;
}

message Suggestion {
  string text = 1;
  SearchResultType result_type = 2;
  double score = 3;
  bool personal = 4;
}

message SuggestionsResponse {
  string query = 1;
  repeated Suggestion items = 2;
}

service BbsSearch {
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc Suggestions(SuggestionsRequest) returns (SuggestionsResponse);
}
