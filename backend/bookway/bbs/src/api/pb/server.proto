syntax = "proto3";
package bookway.bbs;

message ContextRequest { string user_id = 1; }
message SetEdgeRequest { string user_id = 1; string target_user_id = 2; string request_json = 3; }
message RouteContextRequest { string user_id = 1; repeated string route_ids = 2; }
message RouteParticipationRequest { string user_id = 1; string route_id = 2; string request_json = 3; }
message JsonResponse { string response_json = 1; }

service Bbs {
  rpc Context(ContextRequest) returns (JsonResponse);
  rpc VisibilityContext(ContextRequest) returns (JsonResponse);
  rpc SetEdge(SetEdgeRequest) returns (JsonResponse);
  rpc ListRouteParticipations(ContextRequest) returns (JsonResponse);
  rpc RouteContext(RouteContextRequest) returns (JsonResponse);
  rpc SetRouteParticipation(RouteParticipationRequest) returns (JsonResponse);
}
