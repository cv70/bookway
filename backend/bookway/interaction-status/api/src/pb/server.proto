syntax = "proto3";
package bookway.interaction.status;

enum ReactionType {
  REACTION_TYPE_LIKE = 0;
  REACTION_TYPE_BOOKMARK = 1;
  REACTION_TYPE_HIDE = 2;
}

message ContextRequest {
  optional string user_id = 1;
  repeated string post_ids = 2;
}

message ReactionContext {
  repeated string liked_post_ids = 1;
  repeated string bookmarked_post_ids = 2;
  repeated string hidden_post_ids = 3;
}

message SetReactionRequest {
  string user_id = 1;
  string post_id = 2;
  ReactionType reaction = 3;
  bool active = 4;
}

message Reaction {
  string target_id = 1;
  string target_type = 2;
  ReactionType reaction = 3;
  bool active = 4;
  uint64 count = 5;
}

service InteractionStatus {
  rpc Context(ContextRequest) returns (ReactionContext);
  rpc SetReaction(SetReactionRequest) returns (Reaction);
}
