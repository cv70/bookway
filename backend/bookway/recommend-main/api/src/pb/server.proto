syntax = "proto3";
package bookway.recommend.main;

import "bbs-link/api/src/pb/server.proto";

message FeedActionContext {
  string route_id = 1;
  string action_node_id = 2;
  string placement = 3;
  optional string domain = 4;
  // Ads and offers are eligible only for the equipment selected in this
  // action context. The route template remains the authoritative vocabulary.
  optional string scene_equipment = 5;
}
message FeedRequest {
  string user_id = 1;
  repeated bookway.bbs.link.GrowthDomain interests = 2;
  repeated string seen = 3;
  optional uint32 limit = 4;
  string session_id = 5;
  string surface = 6;
  optional string cursor = 7;
  optional FeedActionContext action_context = 8;
  // Delivery context the gateway derives from edge headers; drives
  // fail-closed geo/device targeting in contextual ad mixing.
  string geo_region = 9;
  string device_os = 10;
}
message FeedAd {
  string request_id = 1;
  string campaign_id = 2;
  string placement = 3;
  string title = 4;
  string body = 5;
  string image_url = 6;
  string landing_url = 7;
  double ecpm = 8;
  string model_version = 9;
  string route_id = 10;
  string action_node_id = 11;
  string scene_equipment = 12;
}
message FeedItem {
  string author_id = 1;
  bookway.bbs.link.PostSummary post = 2;
  double score = 3;
  string source = 4;
  repeated string reasons = 5;
  optional FeedAd ad = 6;
}
message FeedMeta {
  uint32 sourced = 1;
  uint32 filtered = 2;
  uint32 selected = 3;
  optional string next_cursor = 4;
  string pipeline_id = 5;
  bool degraded = 6;
  optional string model_version = 7;
  optional string experiment_bucket = 8;
}
message FeedResponse { string request_id = 1; repeated FeedItem items = 2; FeedMeta meta = 3; }

// User Event asks Recommendation Main to prove that a client-reported action
// belongs to the exact ranked item it was served. The response order matches
// the input order so callers can validate an ingestion batch in one RPC.
message ExposureAttribution {
  string request_id = 1;
  string session_id = 2;
  string content_id = 3;
  uint32 position = 4;
}
message ValidateAttributionsRequest {
  string user_id = 1;
  repeated ExposureAttribution attributions = 2;
}
message ValidateAttributionsResponse { repeated bool valid = 1; }

service RecommendMain {
  rpc Feed(FeedRequest) returns (FeedResponse);
  rpc ValidateAttributions(ValidateAttributionsRequest) returns (ValidateAttributionsResponse);
}
